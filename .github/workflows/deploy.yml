name: Deploy Telegram Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch: # ম্যানুয়ালি রান করার জন্য

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # FFmpeg ইনস্টল করা (ZEE5 ডিক্রিপশনের জন্য জরুরি)
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Bot
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} # GitHub Settings > Secrets এ টোকেন সেভ করতে হবে
        run: |
          python main.py
